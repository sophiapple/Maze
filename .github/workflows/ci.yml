name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Check source distribution
        run: |
          mkdir /tmp/maze-sdist
          tar -xzf dist/*.tar.gz -C /tmp/maze-sdist
          cd /tmp/maze-sdist/maze_research-*
          python scripts/verify_release.py
  torch:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: maze train-demo --output runs/train-demo
